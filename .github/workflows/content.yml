name: Content Pipeline

on:
  schedule:
    # Run every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ingest external spaceflight feeds
        run: npm run fetch:feeds
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}

      - name: Generate briefings and quips flavor text
        run: npm run gen:flavor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Pre-generate board snapshots for next 30 days
        run: npm run gen:boards -- 30

      - name: Commit updated content snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore(content): update feeds, flavor, and board snapshots [skip ci]"
            git push
          fi
